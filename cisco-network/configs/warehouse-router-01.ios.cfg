! ============================================================================
! SuperMart - WH-R1  Distribution warehouse, dispatch bay (Cisco 2911 + HWIC-2T slot 0)
! Roles : RIPv2 domain (triangle HQ-R2 / WH-R1 / WH-R2), DHCP for dispatch LAN
! Ports : G0/0 -> WH1-PC (copper cross-over)   S0/0/0 -> HQ-R2 S0/0/1 (10.0.0.12/30)
!         S0/0/1 (DCE) -> WH-R2 S0/0/1 (10.0.0.20/30)
! ============================================================================
enable
configure terminal
hostname WH-R1
no ip domain-lookup
ip domain-name supermart.local
service password-encryption
enable secret SuperMart@2026
username admin privilege 15 secret Admin@NetPass2026
crypto key generate rsa general-keys modulus 1024
ip ssh version 2
line con 0
 password Console@Pass2026
 login
line vty 0 4
 transport input ssh
 login local
exit
!
interface GigabitEthernet0/0
 description WH dispatch LAN 192.168.30.0/26
 ip address 192.168.30.1 255.255.255.192
 no shutdown
interface Serial0/0/0
 description RIP link to HQ-R2 S0/0/1
 ip address 10.0.0.14 255.255.255.252
 no shutdown
interface Serial0/0/1
 description RIP link to WH-R2 S0/0/1
 ip address 10.0.0.21 255.255.255.252
 clock rate 128000
 no shutdown
exit
!
ip dhcp excluded-address 192.168.30.1 192.168.30.9
ip dhcp pool WH1-DISPATCH
 network 192.168.30.0 255.255.255.192
 default-router 192.168.30.1
 dns-server 192.168.11.230
 domain-name supermart.local
exit
!
! --- RIPv2: updates every 30 s to 224.0.0.9, invalid 180, holddown 180, flush 240 ---
router rip
 version 2
 no auto-summary
 network 10.0.0.0
 network 192.168.30.0
 passive-interface GigabitEthernet0/0
 timers basic 30 180 180 240
exit
!
snmp-server community SuperMartRO RO
end
write memory
