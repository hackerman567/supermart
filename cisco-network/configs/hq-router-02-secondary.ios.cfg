! ============================================================================
! SuperMart - HQ-R2  (Cisco 2911 + HWIC-2T in slot 0 + HWIC-2T in slot 1)
! Roles : Router-on-a-stick, HSRP ACTIVE for 30/40/50 (standby for 10/20/99),
!         OSPF area 0, backup WAN to BR-R (cost 200, IPsec), RIPv2 to the
!         warehouse routers, ASBR: redistributes RIP into OSPF (summarised).
! Ports : G0/0 trunk -> HQ-CORE-SW G0/2     G0/1 -> HQ-R1 G0/1 (10.0.0.8/30)
!         S0/0/0 (DCE) -> BR-R S0/0/1        S0/0/1 (DCE) -> WH-R1 S0/0/0
!         S0/1/0 (DCE) -> WH-R2 S0/0/0
!
! BEFORE PASTING (once):
!   license boot module c2900 technology-package securityk9  -> write memory -> reload
! ============================================================================
enable
configure terminal
hostname HQ-R2
no ip domain-lookup
ip domain-name supermart.local
service password-encryption
enable secret SuperMart@2026
username admin privilege 15 secret Admin@NetPass2026
banner motd ^C AUTHORISED ACCESS ONLY - SuperMart HQ-R2 ^C
!
crypto key generate rsa general-keys modulus 1024
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
access-list 10 remark SSH/VTY allowed from Admin VLAN 30 and Mgmt VLAN 99
access-list 10 permit 192.168.11.192 0.0.0.31
access-list 10 permit 192.168.11.240 0.0.0.15
line con 0
 password Console@Pass2026
 login
 logging synchronous
 exec-timeout 10 0
line vty 0 4
 access-class 10 in
 transport input ssh
 login local
 exec-timeout 10 0
exit
!
! --- SECURITY ACLs (same as HQ-R1) ---
ip access-list extended ACL-POS-IN
 remark VLAN10 POS is PCI scope: only the central server, DHCP, and replies to admin pings
 permit udp any any eq bootps
 permit ip 192.168.10.0 0.0.0.255 host 192.168.11.230
 permit icmp 192.168.10.0 0.0.0.255 192.168.11.192 0.0.0.31 echo-reply
 deny ip any any
ip access-list extended ACL-WIFI-IN
 remark VLAN50 Wi-Fi handhelds: DHCP, DNS + web on central server, internet; no other internal LANs
 permit udp any any eq bootps
 permit icmp 192.168.11.0 0.0.0.127 192.168.11.0 0.0.0.127
 permit udp 192.168.11.0 0.0.0.127 host 192.168.11.230 eq domain
 permit tcp 192.168.11.0 0.0.0.127 host 192.168.11.230 eq www
 permit tcp 192.168.11.0 0.0.0.127 host 192.168.11.230 eq 443
 deny ip any 192.168.0.0 0.0.31.255
 deny ip any 10.0.0.0 0.255.255.255
 permit ip 192.168.11.0 0.0.0.127 any
exit
!
! --- INTER-VLAN ROUTING + HSRP (priorities mirror HQ-R1 -> load sharing) ---
interface GigabitEthernet0/0
 description Trunk to HQ-CORE-SW G0/2
 no ip address
 no shutdown
interface GigabitEthernet0/0.10
 description VLAN10 POS-BILLING (HSRP standby)
 encapsulation dot1Q 10
 ip address 192.168.10.3 255.255.255.0
 ip access-group ACL-POS-IN in
 standby 10 ip 192.168.10.1
 standby 10 priority 100
 standby 10 preempt
interface GigabitEthernet0/0.20
 description VLAN20 INVENTORY (HSRP standby)
 encapsulation dot1Q 20
 ip address 192.168.11.131 255.255.255.192
 standby 20 ip 192.168.11.129
 standby 20 priority 100
 standby 20 preempt
interface GigabitEthernet0/0.30
 description VLAN30 ADMIN (HSRP active)
 encapsulation dot1Q 30
 ip address 192.168.11.195 255.255.255.224
 standby 30 ip 192.168.11.193
 standby 30 priority 110
 standby 30 preempt
interface GigabitEthernet0/0.40
 description VLAN40 SERVERS (HSRP active)
 encapsulation dot1Q 40
 ip address 192.168.11.227 255.255.255.240
 standby 40 ip 192.168.11.225
 standby 40 priority 110
 standby 40 preempt
interface GigabitEthernet0/0.50
 description VLAN50 STORE-WIFI (HSRP active)
 encapsulation dot1Q 50
 ip address 192.168.11.3 255.255.255.128
 ip access-group ACL-WIFI-IN in
 standby 50 ip 192.168.11.1
 standby 50 priority 110
 standby 50 preempt
interface GigabitEthernet0/0.99
 description VLAN99 NET-MGMT (HSRP standby)
 encapsulation dot1Q 99
 ip address 192.168.11.243 255.255.255.240
 standby 99 ip 192.168.11.241
 standby 99 priority 100
 standby 99 preempt
!
! --- POINT-TO-POINT LINKS ---
interface GigabitEthernet0/1
 description Link to HQ-R1 G0/1 (OSPF area 0)
 ip address 10.0.0.10 255.255.255.252
 no shutdown
interface Serial0/0/0
 description BACKUP WAN to BR-R S0/0/1 (OSPF area 0, cost 200, IPsec)
 ip address 10.0.0.5 255.255.255.252
 ip ospf cost 200
 clock rate 128000
 no shutdown
interface Serial0/0/1
 description RIP link to WH-R1 S0/0/0
 ip address 10.0.0.13 255.255.255.252
 clock rate 128000
 no shutdown
interface Serial0/1/0
 description RIP link to WH-R2 S0/0/0
 ip address 10.0.0.17 255.255.255.252
 clock rate 128000
 no shutdown
exit
!
! --- OSPF (area 0) + redistribution of the RIP warehouse domain ---
! summary-address turns 192.168.30.0/26 + 192.168.30.64/27 into ONE external route.
router ospf 1
 router-id 2.2.2.2
 passive-interface default
 no passive-interface GigabitEthernet0/1
 no passive-interface Serial0/0/0
 network 192.168.10.0 0.0.1.255 area 0
 network 10.0.0.4 0.0.0.3 area 0
 network 10.0.0.8 0.0.0.3 area 0
 redistribute rip subnets
 summary-address 192.168.30.0 255.255.255.0
exit
!
! --- RIPv2 towards the warehouse (only on S0/0/1 and S0/1/0) ---
router rip
 version 2
 no auto-summary
 network 10.0.0.0
 passive-interface Serial0/0/0
 passive-interface GigabitEthernet0/1
 default-information originate
 timers basic 30 180 180 240
exit
!
! --- IPsec to BR-R over the backup WAN link ---
crypto isakmp policy 10
 encryption aes 256
 hash sha
 authentication pre-share
 group 5
 lifetime 86400
exit
crypto isakmp key SuperMartVPN2026 address 10.0.0.6
crypto ipsec transform-set TS-SUPERMART esp-aes esp-sha-hmac
access-list 110 remark VPN interesting traffic: HQ /23 <-> Branch /24
access-list 110 permit ip 192.168.10.0 0.0.1.255 192.168.20.0 0.0.0.255
crypto map VPN-MAP 10 ipsec-isakmp
 description IPsec to BR-R (backup path)
 set peer 10.0.0.6
 set transform-set TS-SUPERMART
 match address 110
exit
interface Serial0/0/0
 crypto map VPN-MAP
exit
!
snmp-server community SuperMartRO RO
! Lines below are real-IOS SNMP features; Packet Tracer may answer "% Invalid input" - safe to ignore.
snmp-server location HQ-Server-Room-Rack-1
snmp-server contact netadmin@supermart.local
snmp-server enable traps
snmp-server host 192.168.11.231 version 2c SuperMartRO
logging 192.168.11.230
end
write memory
