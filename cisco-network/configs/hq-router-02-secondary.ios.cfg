! ============================================================================
! SuperMart Enterprise Network - HQ Secondary Core Router (Cisco 2911)
! Hostname: HQ-RTR-02-SECONDARY
! Hardware: Cisco 2911 Integrated Services Router
! Roles: HSRP Standby Redundant Gateway (Priority 100), OSPF Area 0 Member, SSH v2
! ============================================================================

enable
configure terminal

hostname HQ-RTR-02-SECONDARY

service password-encryption
enable secret SuperMart@2026
no ip domain-lookup
ip domain-name supermart.local

crypto key generate rsa modulus 2048
ip ssh version 2

username admin privilege 15 secret Admin@NetPass2026

line con 0
 password Console@Pass2026
 login
 logging synchronous
line vty 0 4
 transport input ssh
 login local

banner motd ^C
======================================================================
  SUPERMART SECONDARY BACKUP GATEWAY (HOT STANDBY ROUTER)
======================================================================
^C

! --- REDUNDANT INTER-VLAN SUBINTERFACES (HSRP STANDBY PRIORITY 100) ---
interface GigabitEthernet0/0
 no ip address
 no shutdown
 description TRUNK LINK TO HQ CORE SWITCH G0/2
!
interface GigabitEthernet0/0.10
 encapsulation dot1Q 10
 ip address 192.168.10.3 255.255.255.0
 description POS BILLING GATEWAY (HSRP STANDBY)
 standby 10 ip 192.168.10.1
 standby 10 priority 100
 standby 10 preempt
 no shutdown
!
interface GigabitEthernet0/0.20
 encapsulation dot1Q 20
 ip address 192.168.20.3 255.255.255.0
 description INVENTORY OPS GATEWAY (HSRP STANDBY)
 standby 20 ip 192.168.20.1
 standby 20 priority 100
 standby 20 preempt
 no shutdown
!
interface GigabitEthernet0/0.30
 encapsulation dot1Q 30
 ip address 192.168.30.3 255.255.255.0
 description MANAGEMENT & ADMIN GATEWAY (HSRP STANDBY)
 standby 30 ip 192.168.30.1
 standby 30 priority 100
 standby 30 preempt
 no shutdown
!
interface GigabitEthernet0/0.40
 encapsulation dot1Q 40
 ip address 192.168.40.3 255.255.255.0
 description CENTRAL SERVER FARM GATEWAY (HSRP STANDBY)
 standby 40 ip 192.168.40.1
 standby 40 priority 100
 standby 40 preempt
 no shutdown
!
interface GigabitEthernet0/0.50
 encapsulation dot1Q 50
 ip address 192.168.50.3 255.255.255.0
 description STORE WIRELESS ACCESS GATEWAY (HSRP STANDBY)
 standby 50 ip 192.168.50.1
 standby 50 priority 100
 standby 50 preempt
 no shutdown
!
interface GigabitEthernet0/0.99
 encapsulation dot1Q 99 native
 ip address 192.168.99.3 255.255.255.0
 description SWITCH/ROUTER MANAGEMENT GATEWAY (STANDBY)
 standby 99 ip 192.168.99.1
 standby 99 priority 100
 standby 99 preempt
 no shutdown

! --- HEARTBEAT INTERCONNECT LINK TO PRIMARY ROUTER ---
interface GigabitEthernet0/1
 description HEARTBEAT LINK TO HQ-RTR-01
 ip address 172.16.1.2 255.255.255.252
 no shutdown

! --- OSPF CONFIGURATION ---
router ospf 1
 router-id 1.1.1.2
 network 192.168.10.0 0.0.0.255 area 0
 network 192.168.20.0 0.0.0.255 area 0
 network 192.168.30.0 0.0.0.255 area 0
 network 192.168.40.0 0.0.0.255 area 0
 network 192.168.50.0 0.0.0.255 area 0
 network 192.168.99.0 0.0.0.255 area 0
 network 172.16.1.0 0.0.0.3 area 0
 passive-interface GigabitEthernet0/0.10
 passive-interface GigabitEthernet0/0.20
 passive-interface GigabitEthernet0/0.30
 passive-interface GigabitEthernet0/0.50

end
write memory
