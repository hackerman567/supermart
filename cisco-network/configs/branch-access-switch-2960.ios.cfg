! ============================================================================
! SuperMart - BR-SW  (Cisco 2960-24TT) - Branch 02
! Ports : G0/1 trunk -> BR-R G0/0
!         Fa0/1-12 VLAN 60 branch POS (BR-POS-PC on Fa0/1)
!         Fa0/13-24 VLAN 70 branch office (BR-OFFICE-PC on Fa0/13)
! ============================================================================
enable
configure terminal
hostname BR-SW
no ip domain-lookup
ip domain-name supermart.local
service password-encryption
enable secret SuperMart@2026
username admin privilege 15 secret Admin@NetPass2026
crypto key generate rsa general-keys modulus 1024
ip ssh version 2
line con 0
 password Console@Pass2026
 login
line vty 0 15
 transport input ssh
 login local
exit
!
vlan 60
 name BR-POS
vlan 70
 name BR-OFFICE
vlan 999
 name NATIVE-UNUSED
exit
!
interface GigabitEthernet0/1
 description Trunk to BR-R G0/0
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 60,70,999
 switchport nonegotiate
interface range FastEthernet0/1 - 12
 description Branch POS counters
 switchport mode access
 switchport access vlan 60
 spanning-tree portfast
 spanning-tree bpduguard enable
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 no shutdown
interface range FastEthernet0/13 - 24
 description Branch office PCs
 switchport mode access
 switchport access vlan 70
 spanning-tree portfast
 no shutdown
interface GigabitEthernet0/2
 description UNUSED - shut
 shutdown
exit
!
! Management address lives in the office VLAN (excluded from the DHCP pool)
interface Vlan70
 ip address 192.168.20.66 255.255.255.224
 no shutdown
exit
ip default-gateway 192.168.20.65
snmp-server community SuperMartRO RO
end
write memory
