! ============================================================================
! SuperMart - POS-SW  (Cisco 2960-24TT) - billing counters, VLAN 10
! Roles : access layer (star), port security with sticky MAC, BPDU guard
! Ports : G0/1 trunk -> HQ-CORE-SW Fa0/1
!         Fa0/1 POS-PC-01  Fa0/2 POS-PC-02  Fa0/3 POS-PRINTER (192.168.10.5 static)
! ============================================================================
enable
configure terminal
hostname POS-SW
no ip domain-lookup
ip domain-name supermart.local
service password-encryption
enable secret SuperMart@2026
username admin privilege 15 secret Admin@NetPass2026
crypto key generate rsa general-keys modulus 1024
ip ssh version 2
line con 0
 password Console@Pass2026
 login
line vty 0 15
 transport input ssh
 login local
exit
!
vlan 10
 name POS-BILLING
vlan 99
 name NET-MGMT
vlan 999
 name NATIVE-UNUSED
exit
!
interface GigabitEthernet0/1
 description Trunk to HQ-CORE-SW Fa0/1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,99,999
 switchport nonegotiate
!
! Cash counters: one registered device per port. A rogue laptop is dropped
! (violation restrict) and the violation counter increments.
interface range FastEthernet0/1 - 10
 description POS counter / receipt printer
 switchport mode access
 switchport access vlan 10
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 no shutdown
interface range FastEthernet0/11 - 24, GigabitEthernet0/2
 description UNUSED - shut
 switchport mode access
 switchport access vlan 999
 shutdown
exit
!
interface Vlan99
 ip address 192.168.11.245 255.255.255.240
 no shutdown
exit
ip default-gateway 192.168.11.241
snmp-server community SuperMartRO RO
end
write memory
