! ============================================================================
! SuperMart Enterprise Network - POS Billing Access Switch (Cisco 2960)
! Hostname: POS-ACCESS-SW-2960
! Roles: Port Security Hardening, VLAN 10 Access Distribution to Cash Counters
! ============================================================================

enable
configure terminal

hostname POS-ACCESS-SW-2960

service password-encryption
enable secret SuperMart@2026
no ip domain-lookup

! Create Local VLANs
vlan 10
 name POS-BILLING
vlan 99
 name NATIVE-MGMT

! Uplink to Core Switch
interface GigabitEthernet0/1
 description TRUNK TO HQ-CORE-SW-3560
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,99
 no shutdown

! --- CASHIER POS BILLING PORTS WITH STRICT PORT SECURITY ---
! Ports Fa0/1 through Fa0/10: Connected to POS Counters & Receipt Printers
interface range FastEthernet0/1 - 10
 description POS CASHIER COUNTER TERMINAL
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 spanning-tree bpduguard enable
 ! Port Security: Lock port to registered cashier terminal MAC address
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 no shutdown

! Shut down all unused access ports (Security Hardening)
interface range FastEthernet0/11 - 24
 shutdown
 description UNUSED-SECURITY-SHUTDOWN

interface GigabitEthernet0/2
 shutdown
 description UNUSED-SECURITY-SHUTDOWN

! Management SVI
interface vlan 99
 ip address 192.168.99.20 255.255.255.0
 no shutdown

ip default-gateway 192.168.99.1

end
write memory
