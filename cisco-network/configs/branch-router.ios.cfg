! ============================================================================
! SuperMart Enterprise Network - Remote Retail Branch 02 Router (Cisco 2911)
! Hostname: BRANCH-02-ROUTER
! Hardware: Cisco 2911 with HWIC-2T Serial Card
! Roles: Branch Store Gateway, OSPF Area 1, Site-to-Site IPsec VPN, Branch DHCP
! ============================================================================

enable
configure terminal

hostname BRANCH-02-ROUTER

service password-encryption
enable secret SuperMart@2026
no ip domain-lookup
ip domain-name supermart.local

crypto key generate rsa modulus 2048
ip ssh version 2

username admin privilege 15 secret Admin@NetPass2026

line con 0
 password Console@Pass2026
 login
line vty 0 4
 transport input ssh
 login local

banner motd ^C
======================================================================
  SUPERMART RETAIL STORE - BRANCH 02 REMOTE ACCESS ROUTER
======================================================================
^C

! --- WAN SERIAL LINK TO HQ (POINT-TO-POINT /30) ---
interface Serial0/0/0
 description WAN LINK TO HQ PRIMARY ROUTER
 ip address 10.0.0.2 255.255.255.252
 no shutdown

! --- BRANCH LOCAL STORE LAN GATEWAY ---
interface GigabitEthernet0/0
 description BRANCH LOCAL SWITCH UPLINK
 ip address 192.168.60.1 255.255.255.0
 no shutdown

! --- BRANCH DHCP POOL FOR REMOTE BILLING COUNTERS ---
ip dhcp excluded-address 192.168.60.1 192.168.60.9

ip dhcp pool POOL-BRANCH-STORE
 network 192.168.60.0 255.255.255.0
 default-router 192.168.60.1
 dns-server 192.168.40.10
 domain-name supermart.local

! --- OSPF AREA 1 CONFIGURATION ---
router ospf 1
 router-id 2.2.2.2
 network 10.0.0.0 0.0.0.3 area 1
 network 192.168.60.0 0.0.0.255 area 1
 passive-interface GigabitEthernet0/0

! --- SITE-TO-SITE IPSEC VPN TUNNEL (Branch Store <-> HQ Data Center) ---
! Phase 1: ISAKMP Policy (IKE)
crypto isakmp policy 10
 encr aes 256
 hash sha256
 authentication pre-share
 group 14
 lifetime 86400

crypto isakmp key SuperMartVPNSecret2026 address 10.0.0.1

! Phase 2: Transform Set & IPsec Security Association
crypto ipsec transform-set TS-SUPERMART-VPN esp-aes 256 esp-sha256-hmac

! Interesting Traffic ACL: Encrypt Branch (192.168.60.0/24) to HQ Server Farm (192.168.40.0/24)
ip access-list extended ACL-VPN-TRAFFIC
 permit ip 192.168.60.0 0.0.0.255 192.168.40.0 0.0.0.255
 permit ip 192.168.60.0 0.0.0.255 192.168.10.0 0.0.0.255

! Crypto Map Binding
crypto map CMAP-BRANCH 10 ipsec-isakmp
 set peer 10.0.0.1
 set transform-set TS-SUPERMART-VPN
 match address ACL-VPN-TRAFFIC

interface Serial0/0/0
 crypto map CMAP-BRANCH

end
write memory
