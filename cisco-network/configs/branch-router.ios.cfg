! ============================================================================
! SuperMart - BR-R  Branch 02 router (Cisco 2911 + HWIC-2T in slot 0)
! Roles : Router-on-a-stick for VLAN 60/70, DHCP for branch, OSPF ABR
!         (area 0 WAN links / area 1 branch LANs, area 1 summarised to /24),
!         IPsec site-to-site VPN to HQ-R1 (primary) and HQ-R2 (backup).
! Ports : G0/0 trunk -> BR-SW G0/1
!         S0/0/0 -> HQ-R1 S0/0/0 (10.0.0.0/30)   S0/0/1 -> HQ-R2 S0/0/0 (10.0.0.4/30)
!
! BEFORE PASTING (once):
!   license boot module c2900 technology-package securityk9  -> write memory -> reload
! ============================================================================
enable
configure terminal
hostname BR-R
no ip domain-lookup
ip domain-name supermart.local
service password-encryption
enable secret SuperMart@2026
username admin privilege 15 secret Admin@NetPass2026
banner motd ^C AUTHORISED ACCESS ONLY - SuperMart Branch 02 ^C
!
crypto key generate rsa general-keys modulus 1024
ip ssh version 2
access-list 10 remark SSH/VTY from HQ Admin VLAN 30 and branch office VLAN 70
access-list 10 permit 192.168.11.192 0.0.0.31
access-list 10 permit 192.168.20.64 0.0.0.31
line con 0
 password Console@Pass2026
 login
 logging synchronous
line vty 0 4
 access-class 10 in
 transport input ssh
 login local
exit
!
! --- BRANCH LANs (VLSM: /26 for POS, /27 for office) ---
interface GigabitEthernet0/0
 description Trunk to BR-SW G0/1
 no ip address
 no shutdown
interface GigabitEthernet0/0.60
 description VLAN60 BR-POS 192.168.20.0/26
 encapsulation dot1Q 60
 ip address 192.168.20.1 255.255.255.192
interface GigabitEthernet0/0.70
 description VLAN70 BR-OFFICE 192.168.20.64/27
 encapsulation dot1Q 70
 ip address 192.168.20.65 255.255.255.224
!
! --- WAN LINKS ---
interface Serial0/0/0
 description PRIMARY WAN to HQ-R1 S0/0/0
 ip address 10.0.0.2 255.255.255.252
 no shutdown
interface Serial0/0/1
 description BACKUP WAN to HQ-R2 S0/0/0 (cost 200)
 ip address 10.0.0.6 255.255.255.252
 ip ospf cost 200
 no shutdown
exit
!
! --- DHCP for branch VLANs (DNS is the HQ server, reached over the VPN) ---
ip dhcp excluded-address 192.168.20.1 192.168.20.9
ip dhcp excluded-address 192.168.20.65 192.168.20.69
ip dhcp pool VLAN60-BR-POS
 network 192.168.20.0 255.255.255.192
 default-router 192.168.20.1
 dns-server 192.168.11.230
 domain-name supermart.local
ip dhcp pool VLAN70-BR-OFFICE
 network 192.168.20.64 255.255.255.224
 default-router 192.168.20.65
 dns-server 192.168.11.230
 domain-name supermart.local
exit
!
! --- OSPF: BR-R is the Area Border Router ---
! area 1 range = route summarisation: area 0 sees ONE Type-3 LSA 192.168.20.0/24
router ospf 1
 router-id 3.3.3.3
 passive-interface default
 no passive-interface Serial0/0/0
 no passive-interface Serial0/0/1
 network 10.0.0.0 0.0.0.3 area 0
 network 10.0.0.4 0.0.0.3 area 0
 network 192.168.20.0 0.0.0.127 area 1
 area 1 range 192.168.20.0 255.255.255.0
exit
!
! --- IPsec: one crypto map per WAN link / HQ peer ---
crypto isakmp policy 10
 encryption aes 256
 hash sha
 authentication pre-share
 group 5
 lifetime 86400
exit
crypto isakmp key SuperMartVPN2026 address 10.0.0.1
crypto isakmp key SuperMartVPN2026 address 10.0.0.5
crypto ipsec transform-set TS-SUPERMART esp-aes esp-sha-hmac
access-list 110 remark VPN interesting traffic: Branch /24 <-> HQ /23
access-list 110 permit ip 192.168.20.0 0.0.0.255 192.168.10.0 0.0.1.255
crypto map VPN-MAP-R1 10 ipsec-isakmp
 description IPsec to HQ-R1 (primary)
 set peer 10.0.0.1
 set transform-set TS-SUPERMART
 match address 110
crypto map VPN-MAP-R2 10 ipsec-isakmp
 description IPsec to HQ-R2 (backup)
 set peer 10.0.0.5
 set transform-set TS-SUPERMART
 match address 110
exit
interface Serial0/0/0
 crypto map VPN-MAP-R1
interface Serial0/0/1
 crypto map VPN-MAP-R2
exit
!
snmp-server community SuperMartRO RO
! Lines below are real-IOS SNMP features; Packet Tracer may answer "% Invalid input" - safe to ignore.
snmp-server location Branch-02-Comms-Cabinet
snmp-server contact netadmin@supermart.local
snmp-server enable traps
snmp-server host 192.168.11.231 version 2c SuperMartRO
logging 192.168.11.230
end
write memory
