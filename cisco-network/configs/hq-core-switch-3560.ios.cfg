! ============================================================================
! SuperMart - HQ-CORE-SW  (Cisco 3560-24PS, used at Layer 2)
! Roles : VLAN database, 802.1Q trunk aggregation (star centre of HQ),
!         Rapid-PVST root bridge, management SVI in VLAN 99.
! Ports : G0/1 -> HQ-R1 G0/0   G0/2 -> HQ-R2 G0/0
!         Fa0/1 -> POS-SW G0/1  Fa0/2 -> SRV-SW G0/1  Fa0/3 -> FLOOR-SW G0/1
! Note  : the 3560 could also do inter-VLAN routing itself (ip routing + SVIs);
!         we route on the two 2911s instead so HSRP can give gateway redundancy.
! ============================================================================
enable
configure terminal
hostname HQ-CORE-SW
no ip domain-lookup
ip domain-name supermart.local
service password-encryption
enable secret SuperMart@2026
username admin privilege 15 secret Admin@NetPass2026
crypto key generate rsa general-keys modulus 1024
ip ssh version 2
line con 0
 password Console@Pass2026
 login
line vty 0 15
 transport input ssh
 login local
exit
!
spanning-tree mode rapid-pvst
spanning-tree vlan 10,20,30,40,50,99 root primary
!
vlan 10
 name POS-BILLING
vlan 20
 name INVENTORY
vlan 30
 name ADMIN
vlan 40
 name SERVERS
vlan 50
 name STORE-WIFI
vlan 99
 name NET-MGMT
vlan 999
 name NATIVE-UNUSED
exit
!
interface GigabitEthernet0/1
 description Trunk to HQ-R1 G0/0
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,99,999
 switchport nonegotiate
interface GigabitEthernet0/2
 description Trunk to HQ-R2 G0/0
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,99,999
 switchport nonegotiate
interface FastEthernet0/1
 description Trunk to POS-SW G0/1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,99,999
 switchport nonegotiate
interface FastEthernet0/2
 description Trunk to SRV-SW G0/1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 40,99,999
 switchport nonegotiate
interface FastEthernet0/3
 description Trunk to FLOOR-SW G0/1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 20,30,50,99,999
 switchport nonegotiate
interface range FastEthernet0/4 - 24
 description UNUSED - shut
 switchport mode access
 switchport access vlan 999
 shutdown
exit
!
interface Vlan99
 description Management SVI
 ip address 192.168.11.244 255.255.255.240
 no shutdown
exit
ip default-gateway 192.168.11.241
!
snmp-server community SuperMartRO RO
end
write memory
