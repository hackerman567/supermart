! ============================================================================
! SuperMart Enterprise Network - HQ Core Multilayer Switch (Cisco 3560)
! Hostname: HQ-CORE-SW-3560
! Roles: VLAN Central Management, 802.1Q Trunk Aggregation, STP Root Bridge
! ============================================================================

enable
configure terminal

hostname HQ-CORE-SW-3560

service password-encryption
enable secret SuperMart@2026
no ip domain-lookup

! Spanning Tree Tuning
spanning-tree mode rapid-pvst
spanning-tree vlan 10,20,30,40,50,99 root primary

! --- CREATE ENTERPRISE STORE VLANS ---
vlan 10
 name POS-BILLING
vlan 20
 name INVENTORY-OPS
vlan 30
 name MANAGEMENT
vlan 40
 name SERVER-FARM
vlan 50
 name STORE-WIFI
vlan 99
 name NATIVE-MGMT

! --- TRUNK PORTS TO ROUTERS & ACCESS SWITCHES ---
! Uplink to HQ Primary Router
interface GigabitEthernet0/1
 description TRUNK LINK TO HQ-RTR-01
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,50,99
 no shutdown

! Uplink to HQ Secondary Router
interface GigabitEthernet0/2
 description TRUNK LINK TO HQ-RTR-02
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,50,99
 no shutdown

! Downlink to POS Billing Access Switch
interface FastEthernet0/1
 description TRUNK TO POS-ACCESS-SW-2960
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,99
 no shutdown

! Downlink to Server Farm Switch
interface FastEthernet0/2
 description TRUNK TO SERVERS-SW-2960
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 40,99
 no shutdown

! Downlink to Inventory & Admin Access Switch
interface FastEthernet0/3
 description TRUNK TO FLOOR-ACCESS-SW-2960
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 20,30,50,99
 no shutdown

! Management SVI
interface vlan 99
 ip address 192.168.99.10 255.255.255.0
 no shutdown

ip default-gateway 192.168.99.1

end
write memory
