! ============================================================================
! ISP-R  Simulated Internet Service Provider edge (Cisco 2911)
! Ports : G0/0 -> HQ-ASA G1/1 (203.0.113.0/30, public hand-off)
!         G0/1 -> INTERNET-SRV (198.51.100.0/24, "the internet")
! The ISP needs no route to SuperMart's private space: the ASA hides it
! behind 203.0.113.2 with PAT, so connected routes are enough.
! ============================================================================
enable
configure terminal
hostname ISP-R
no ip domain-lookup
enable secret IspSecret2026
interface GigabitEthernet0/0
 description Customer hand-off: SuperMart HQ-ASA
 ip address 203.0.113.1 255.255.255.252
 no shutdown
interface GigabitEthernet0/1
 description Internet server farm
 ip address 198.51.100.1 255.255.255.0
 no shutdown
end
write memory
