! ============================================================================
! SuperMart - HQ-ASA  (Cisco ASA 5506-X) - Internet edge firewall
! Ports : G1/1 outside -> ISP-R G0/0 (203.0.113.2/30, security-level 0)
!         G1/2 inside  -> HQ-R1 G0/2 (10.0.0.26/30,   security-level 100)
!
! FIREWALL POLICY
!   inside -> outside : only DNS, HTTP, HTTPS and ICMP (ACL INSIDE-OUT)
!   outside -> inside : nothing is initiated from the internet (ACL OUTSIDE-IN);
!                       return traffic is allowed statefully + ICMP inspection
!   NAT               : all of 192.168.0.0/19 is PAT-ed to 203.0.113.2
!
! PT's 5506-X may ship with factory defaults (inside DHCP server, other IPs).
! The interface lines below overwrite the IPs; if "show run" still shows
! "dhcpd enable inside", remove it with: no dhcpd enable inside
! ============================================================================
enable
configure terminal
hostname HQ-ASA
domain-name supermart.local
enable password SuperMart@2026
username admin password Admin@NetPass2026
!
interface GigabitEthernet1/1
 nameif outside
 security-level 0
 ip address 203.0.113.2 255.255.255.252
 no shutdown
interface GigabitEthernet1/2
 nameif inside
 security-level 100
 ip address 10.0.0.26 255.255.255.252
 no shutdown
exit
!
! --- STATIC ROUTING. The inside routes are CIDR summaries:
!     192.168.0.0/19 covers HQ 192.168.10-11, branch 192.168.20, warehouse 192.168.30
!     10.0.0.0/27   covers every point-to-point /30 link
route outside 0.0.0.0 0.0.0.0 203.0.113.1
route inside 192.168.0.0 255.255.224.0 10.0.0.25
route inside 10.0.0.0 255.255.255.224 10.0.0.25
!
! --- PAT ---
object network SUPERMART-LANS
 subnet 192.168.0.0 255.255.224.0
 nat (inside,outside) dynamic interface
exit
!
! --- FIREWALL POLICY ---
access-list INSIDE-OUT extended permit udp any any eq domain
access-list INSIDE-OUT extended permit tcp any any eq www
access-list INSIDE-OUT extended permit tcp any any eq 443
access-list INSIDE-OUT extended permit icmp any any
access-list INSIDE-OUT extended deny ip any any
access-list OUTSIDE-IN extended deny ip any any
access-group INSIDE-OUT in interface inside
access-group OUTSIDE-IN in interface outside
!
class-map inspection_default
 match default-inspection-traffic
exit
policy-map global_policy
 class inspection_default
  inspect dns
  inspect http
  inspect icmp
exit
exit
service-policy global_policy global
!
! --- SSH management from the Admin VLAN only ---
aaa authentication ssh console LOCAL
crypto key generate rsa modulus 1024
ssh 192.168.11.192 255.255.255.224 inside
ssh timeout 10
end
write memory
