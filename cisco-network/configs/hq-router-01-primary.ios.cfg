! ============================================================================
! SuperMart Enterprise Network - HQ Primary Core Router (Cisco 2911)
! Hostname: HQ-RTR-01-PRIMARY
! Hardware: Cisco 2911 Integrated Services Router with HWIC-2T Serial Card
! Roles: Inter-VLAN Routing (802.1Q), HSRP Active Gateway (Priority 120),
!        OSPF Area 0 Backbone + Area 1 ABR, NAT/PAT, Extended ACLs, SSH v2
! ============================================================================

enable
configure terminal

hostname HQ-RTR-01-PRIMARY

! --- SYSTEM SECURITY & PASSWORDS ---
service password-encryption
enable secret SuperMart@2026
no ip domain-lookup
ip domain-name supermart.local

! RSA Keys & SSH v2
crypto key generate rsa modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3

username admin privilege 15 secret Admin@NetPass2026

line con 0
 password Console@Pass2026
 login
 logging synchronous
 exec-timeout 10 0
line aux 0
line vty 0 4
 transport input ssh
 login local
 exec-timeout 10 0

banner motd ^C
======================================================================
  AUTHORIZED ACCESS ONLY - SUPERMART CENTRAL RETAIL ENTERPRISE NETWORK
  WARNING: ALL SESSIONS ARE MONITORED VIA CENTRAL SYSLOG & SNMP
======================================================================
^C

! --- INTER-VLAN ROUTING & HSRP REDUNDANCY (ROUTER-ON-A-STICK G0/0) ---
interface GigabitEthernet0/0
 no ip address
 no shutdown
 description TRUNK LINK TO HQ CORE SWITCH G0/1
!
! VLAN 10: POS BILLING COUNTERS
interface GigabitEthernet0/0.10
 encapsulation dot1Q 10
 ip address 192.168.10.2 255.255.255.0
 description POS BILLING GATEWAY (HSRP ACTIVE)
 standby 10 ip 192.168.10.1
 standby 10 priority 120
 standby 10 preempt
 standby 10 track GigabitEthernet0/1 30
 no shutdown
!
! VLAN 20: INVENTORY & WAREHOUSE
interface GigabitEthernet0/0.20
 encapsulation dot1Q 20
 ip address 192.168.20.2 255.255.255.0
 description INVENTORY OPS GATEWAY (HSRP ACTIVE)
 standby 20 ip 192.168.20.1
 standby 20 priority 120
 standby 20 preempt
 no shutdown
!
! VLAN 30: MANAGEMENT & ADMIN
interface GigabitEthernet0/0.30
 encapsulation dot1Q 30
 ip address 192.168.30.2 255.255.255.0
 description MANAGEMENT & ADMIN GATEWAY (HSRP ACTIVE)
 standby 30 ip 192.168.30.1
 standby 30 priority 120
 standby 30 preempt
 no shutdown
!
! VLAN 40: CENTRAL SERVER FARM
interface GigabitEthernet0/0.40
 encapsulation dot1Q 40
 ip address 192.168.40.2 255.255.255.0
 description CENTRAL SERVER FARM GATEWAY (HSRP ACTIVE)
 standby 40 ip 192.168.40.1
 standby 40 priority 120
 standby 40 preempt
 no shutdown
!
! VLAN 50: STORE WI-FI & HANDHELDS
interface GigabitEthernet0/0.50
 encapsulation dot1Q 50
 ip address 192.168.50.2 255.255.255.0
 description STORE WIRELESS ACCESS GATEWAY (HSRP ACTIVE)
 standby 50 ip 192.168.50.1
 standby 50 priority 120
 standby 50 preempt
 no shutdown
!
! VLAN 99: NATIVE & NETWORK MANAGEMENT
interface GigabitEthernet0/0.99
 encapsulation dot1Q 99 native
 ip address 192.168.99.2 255.255.255.0
 description SWITCH/ROUTER MANAGEMENT GATEWAY
 standby 99 ip 192.168.99.1
 standby 99 priority 120
 standby 99 preempt
 no shutdown

! --- WAN SERIAL LINK TO BRANCH 02 (POINT-TO-POINT /30) ---
interface Serial0/0/0
 description WAN LINK TO BRANCH-02-ROUTER
 ip address 10.0.0.1 255.255.255.252
 clock rate 128000
 no shutdown

! --- DUAL ROUTER INTERCONNECT LINK (TO HQ-RTR-02-SECONDARY) ---
interface GigabitEthernet0/1
 description HEARTBEAT LINK TO HQ-RTR-02
 ip address 172.16.1.1 255.255.255.252
 no shutdown

! --- CISCO DHCP SERVER POOLS FOR SUPERMARKET VLANS ---
ip dhcp excluded-address 192.168.10.1 192.168.10.9
ip dhcp excluded-address 192.168.20.1 192.168.20.9
ip dhcp excluded-address 192.168.30.1 192.168.30.9
ip dhcp excluded-address 192.168.50.1 192.168.50.9

ip dhcp pool POOL-POS-VLAN10
 network 192.168.10.0 255.255.255.0
 default-router 192.168.10.1
 dns-server 192.168.40.10
 domain-name supermart.local
 lease 1 0 0

ip dhcp pool POOL-INVENTORY-VLAN20
 network 192.168.20.0 255.255.255.0
 default-router 192.168.20.1
 dns-server 192.168.40.10
 domain-name supermart.local
 lease 1 0 0

ip dhcp pool POOL-MGMT-VLAN30
 network 192.168.30.0 255.255.255.0
 default-router 192.168.30.1
 dns-server 192.168.40.10
 domain-name supermart.local
 lease 3 0 0

ip dhcp pool POOL-WIFI-VLAN50
 network 192.168.50.0 255.255.255.0
 default-router 192.168.50.1
 dns-server 192.168.40.10
 domain-name supermart.local
 lease 0 4 0

! --- MULTI-AREA OSPF CONFIGURATION ---
router ospf 1
 router-id 1.1.1.1
 ! Area 0: Enterprise Backbone (HQ Store Subnets)
 network 192.168.10.0 0.0.0.255 area 0
 network 192.168.20.0 0.0.0.255 area 0
 network 192.168.30.0 0.0.0.255 area 0
 network 192.168.40.0 0.0.0.255 area 0
 network 192.168.50.0 0.0.0.255 area 0
 network 192.168.99.0 0.0.0.255 area 0
 network 172.16.1.0 0.0.0.3 area 0
 ! Area 1: Remote Retail Branch Store WAN Link
 network 10.0.0.0 0.0.0.3 area 1
 ! Suppress unnecessary hello packets to end devices
 passive-interface GigabitEthernet0/0.10
 passive-interface GigabitEthernet0/0.20
 passive-interface GigabitEthernet0/0.30
 passive-interface GigabitEthernet0/0.50

! --- EXTENDED ACCESS CONTROL LISTS (SECURITY SEGREGATION) ---
ip access-list extended ACL-STORE-SECURITY
 ! Permit POS to reach Central Server Farm Web & DB Port 5000 & 80
 permit tcp 192.168.10.0 0.0.0.255 host 192.168.40.10 eq 5000
 permit tcp 192.168.10.0 0.0.0.255 host 192.168.40.10 eq 80
 permit udp 192.168.10.0 0.0.0.255 host 192.168.40.10 eq 53
 permit icmp 192.168.10.0 0.0.0.255 host 192.168.40.10
 ! Isolate Guest Wi-Fi (VLAN 50) from POS (VLAN 10) and Server Farm (VLAN 40)
 deny ip 192.168.50.0 0.0.0.255 192.168.10.0 0.0.0.255
 deny ip 192.168.50.0 0.0.0.255 192.168.40.0 0.0.0.255
 ! Permit all other standard routed internal traffic
 permit ip any any

interface GigabitEthernet0/0.50
 ip access-group ACL-STORE-SECURITY in

! --- SNMP MONITORING & SYSLOG HARDENING ---
logging 192.168.40.10
logging trap notifications
snmp-server community SuperMartRO RO
snmp-server location "HQ Hypermarket Floor 1 - Server Rack 01"
snmp-server contact "netadmin@supermart.local"

end
write memory
