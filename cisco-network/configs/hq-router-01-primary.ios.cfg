! ============================================================================
! SuperMart - HQ-R1  (Cisco 2911 + HWIC-2T in slot 0)
! Roles : Router-on-a-stick (VLAN 10/20/30/40/50/99), HSRP ACTIVE for 10/20/99
!         (standby for 30/40/50 -> per-VLAN load sharing with HQ-R2),
!         DHCP server for HQ VLANs, OSPF area 0, static default to HQ-ASA
!         (redistributed into OSPF), IPsec site-to-site VPN to BR-R (primary).
! Ports : G0/0 trunk -> HQ-CORE-SW G0/1     G0/1 -> HQ-R2 G0/1 (10.0.0.8/30)
!         G0/2 -> HQ-ASA G1/2 (10.0.0.24/30) S0/0/0 (DCE) -> BR-R S0/0/0
!
! BEFORE PASTING (once): the 2911 needs the security licence for IPsec.
!   enable / configure terminal
!   license boot module c2900 technology-package securityk9   (answer yes)
!   end / write memory / reload
! ============================================================================
enable
configure terminal
hostname HQ-R1
no ip domain-lookup
ip domain-name supermart.local
service password-encryption
enable secret SuperMart@2026
username admin privilege 15 secret Admin@NetPass2026
banner motd ^C AUTHORISED ACCESS ONLY - SuperMart HQ-R1 ^C
!
! --- SSH v2 (management only from Admin VLAN 30 and Mgmt VLAN 99) ---
crypto key generate rsa general-keys modulus 1024
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
access-list 10 remark SSH/VTY allowed from Admin VLAN 30 and Mgmt VLAN 99
access-list 10 permit 192.168.11.192 0.0.0.31
access-list 10 permit 192.168.11.240 0.0.0.15
line con 0
 password Console@Pass2026
 login
 logging synchronous
 exec-timeout 10 0
line vty 0 4
 access-class 10 in
 transport input ssh
 login local
 exec-timeout 10 0
exit
!
! --- SECURITY ACLs (identical on HQ-R2 so failover keeps the policy) ---
ip access-list extended ACL-POS-IN
 remark VLAN10 POS is PCI scope: only the central server, DHCP, and replies to admin pings
 permit udp any any eq bootps
 permit ip 192.168.10.0 0.0.0.255 host 192.168.11.230
 permit icmp 192.168.10.0 0.0.0.255 192.168.11.192 0.0.0.31 echo-reply
 deny ip any any
ip access-list extended ACL-WIFI-IN
 remark VLAN50 Wi-Fi handhelds: DHCP, DNS + web on central server, internet; no other internal LANs
 permit udp any any eq bootps
 permit icmp 192.168.11.0 0.0.0.127 192.168.11.0 0.0.0.127
 permit udp 192.168.11.0 0.0.0.127 host 192.168.11.230 eq domain
 permit tcp 192.168.11.0 0.0.0.127 host 192.168.11.230 eq www
 permit tcp 192.168.11.0 0.0.0.127 host 192.168.11.230 eq 443
 deny ip any 192.168.0.0 0.0.31.255
 deny ip any 10.0.0.0 0.255.255.255
 permit ip 192.168.11.0 0.0.0.127 any
exit
!
! --- INTER-VLAN ROUTING (router-on-a-stick) + HSRP ---
! Native VLAN 999 is an unused "black-hole" VLAN, so G0/0 itself has no IP.
interface GigabitEthernet0/0
 description Trunk to HQ-CORE-SW G0/1
 no ip address
 no shutdown
interface GigabitEthernet0/0.10
 description VLAN10 POS-BILLING 192.168.10.0/24 (HSRP active)
 encapsulation dot1Q 10
 ip address 192.168.10.2 255.255.255.0
 ip access-group ACL-POS-IN in
 standby 10 ip 192.168.10.1
 standby 10 priority 110
 standby 10 preempt
interface GigabitEthernet0/0.20
 description VLAN20 INVENTORY 192.168.11.128/26 (HSRP active)
 encapsulation dot1Q 20
 ip address 192.168.11.130 255.255.255.192
 standby 20 ip 192.168.11.129
 standby 20 priority 110
 standby 20 preempt
interface GigabitEthernet0/0.30
 description VLAN30 ADMIN 192.168.11.192/27 (HSRP standby)
 encapsulation dot1Q 30
 ip address 192.168.11.194 255.255.255.224
 standby 30 ip 192.168.11.193
 standby 30 priority 100
 standby 30 preempt
interface GigabitEthernet0/0.40
 description VLAN40 SERVERS 192.168.11.224/28 (HSRP standby)
 encapsulation dot1Q 40
 ip address 192.168.11.226 255.255.255.240
 standby 40 ip 192.168.11.225
 standby 40 priority 100
 standby 40 preempt
interface GigabitEthernet0/0.50
 description VLAN50 STORE-WIFI 192.168.11.0/25 (HSRP standby)
 encapsulation dot1Q 50
 ip address 192.168.11.2 255.255.255.128
 ip access-group ACL-WIFI-IN in
 standby 50 ip 192.168.11.1
 standby 50 priority 100
 standby 50 preempt
interface GigabitEthernet0/0.99
 description VLAN99 NET-MGMT 192.168.11.240/28 (HSRP active)
 encapsulation dot1Q 99
 ip address 192.168.11.242 255.255.255.240
 standby 99 ip 192.168.11.241
 standby 99 priority 110
 standby 99 preempt
!
! --- POINT-TO-POINT LINKS ---
interface GigabitEthernet0/1
 description Link to HQ-R2 G0/1 (OSPF area 0)
 ip address 10.0.0.9 255.255.255.252
 no shutdown
interface GigabitEthernet0/2
 description Link to HQ-ASA G1/2 inside (static routing)
 ip address 10.0.0.25 255.255.255.252
 no shutdown
interface Serial0/0/0
 description PRIMARY WAN to BR-R S0/0/0 (OSPF area 0, IPsec)
 ip address 10.0.0.1 255.255.255.252
 clock rate 128000
 no shutdown
exit
!
! --- DHCP SERVER (one server for all HQ VLANs; HQ-R2 has no pools) ---
! Options sent: 1 subnet mask, 3 default-router (HSRP VIP), 6 DNS, 15 domain, 51 lease
ip dhcp excluded-address 192.168.10.1 192.168.10.10
ip dhcp excluded-address 192.168.11.1 192.168.11.10
ip dhcp excluded-address 192.168.11.129 192.168.11.135
ip dhcp excluded-address 192.168.11.193 192.168.11.199
ip dhcp pool VLAN10-POS
 network 192.168.10.0 255.255.255.0
 default-router 192.168.10.1
 dns-server 192.168.11.230
 domain-name supermart.local
ip dhcp pool VLAN50-WIFI
 network 192.168.11.0 255.255.255.128
 default-router 192.168.11.1
 dns-server 192.168.11.230
 domain-name supermart.local
ip dhcp pool VLAN20-INVENTORY
 network 192.168.11.128 255.255.255.192
 default-router 192.168.11.129
 dns-server 192.168.11.230
 domain-name supermart.local
ip dhcp pool VLAN30-ADMIN
 network 192.168.11.192 255.255.255.224
 default-router 192.168.11.193
 dns-server 192.168.11.230
 domain-name supermart.local
exit
!
! --- STATIC ROUTING: default route to the firewall ---
ip route 0.0.0.0 0.0.0.0 10.0.0.26
!
! --- OSPF (area 0). 192.168.10.0 0.0.1.255 matches the whole HQ /23 ---
router ospf 1
 router-id 1.1.1.1
 passive-interface default
 no passive-interface GigabitEthernet0/1
 no passive-interface Serial0/0/0
 network 192.168.10.0 0.0.1.255 area 0
 network 10.0.0.0 0.0.0.3 area 0
 network 10.0.0.8 0.0.0.3 area 0
 default-information originate
exit
!
! --- SITE-TO-SITE IPsec VPN to BR-R over the primary WAN link ---
crypto isakmp policy 10
 encryption aes 256
 hash sha
 authentication pre-share
 group 5
 lifetime 86400
exit
crypto isakmp key SuperMartVPN2026 address 10.0.0.2
crypto ipsec transform-set TS-SUPERMART esp-aes esp-sha-hmac
access-list 110 remark VPN interesting traffic: HQ /23 <-> Branch /24
access-list 110 permit ip 192.168.10.0 0.0.1.255 192.168.20.0 0.0.0.255
crypto map VPN-MAP 10 ipsec-isakmp
 description IPsec to BR-R (primary path)
 set peer 10.0.0.2
 set transform-set TS-SUPERMART
 match address 110
exit
interface Serial0/0/0
 crypto map VPN-MAP
exit
!
! --- MANAGEMENT: SNMP agent + syslog to SRV-CENTRAL-01 ---
snmp-server community SuperMartRO RO
! Lines below are real-IOS SNMP features; Packet Tracer may answer "% Invalid input" - safe to ignore.
snmp-server location HQ-Server-Room-Rack-1
snmp-server contact netadmin@supermart.local
snmp-server enable traps
snmp-server host 192.168.11.231 version 2c SuperMartRO
logging 192.168.11.230
end
write memory
