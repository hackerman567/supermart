! ============================================================================
! SuperMart - WH-R2  Distribution warehouse, cold storage (Cisco 2911 + HWIC-2T slot 0)
! Roles : RIPv2 domain (triangle HQ-R2 / WH-R1 / WH-R2), DHCP for cold-storage LAN
! Ports : G0/0 -> WH2-PC (copper cross-over)   S0/0/0 -> HQ-R2 S0/1/0 (10.0.0.16/30)
!         S0/0/1 -> WH-R1 S0/0/1 (10.0.0.20/30)
! ============================================================================
enable
configure terminal
hostname WH-R2
no ip domain-lookup
ip domain-name supermart.local
service password-encryption
enable secret SuperMart@2026
username admin privilege 15 secret Admin@NetPass2026
crypto key generate rsa general-keys modulus 1024
ip ssh version 2
line con 0
 password Console@Pass2026
 login
line vty 0 4
 transport input ssh
 login local
exit
!
interface GigabitEthernet0/0
 description WH cold-storage LAN 192.168.30.64/27
 ip address 192.168.30.65 255.255.255.224
 no shutdown
interface Serial0/0/0
 description RIP link to HQ-R2 S0/1/0
 ip address 10.0.0.18 255.255.255.252
 no shutdown
interface Serial0/0/1
 description RIP link to WH-R1 S0/0/1
 ip address 10.0.0.22 255.255.255.252
 no shutdown
exit
!
ip dhcp excluded-address 192.168.30.65 192.168.30.69
ip dhcp pool WH2-COLD
 network 192.168.30.64 255.255.255.224
 default-router 192.168.30.65
 dns-server 192.168.11.230
 domain-name supermart.local
exit
!
router rip
 version 2
 no auto-summary
 network 10.0.0.0
 network 192.168.30.0
 passive-interface GigabitEthernet0/0
 timers basic 30 180 180 240
exit
!
snmp-server community SuperMartRO RO
end
write memory
